<div class="container" id="form2">
    <h2>Student Information</h2>
<form action="" id="admission">
    <div class="row" id="">
        <div class="col" id="fname">
            <label for="name">First Name:</label>
            <input type="text" class="name" id="name" placeholder="enter here">
        </div>
        <div class="col" id="lname">
            <label for="name">Last Name:</label>
            <input type="text" class="name" id="name" placeholder="enter here">
        </div>
        <div class="col">
            <label for="birthday">Birthday:</label>
            <input type="date" class="date" id="bdaydate">
        </div>
    </div>

    <br><br>

    <div class="row">
        <div class="col">
            <label for="gender">Gender:</label>
            <select class="form-select" id="selection" name="select list">
                <option>Female</option>
                <option>Male</option>
                <option>Non-Binary</option>
            </select>
        </div>

        <div class="col">
            <label for="gradelevel">Grade Level:</label>
            <select class="form-select" id="selection2" name="select list 2">
                <option>Senior High School (SHS) (grade 11-12)</option>
                <option>Junior High School (JHS) (grade 7-10)</option>
                <option>Intermediate (grade 4-6)</option>
                <option>Primary (grade 1-3)</option>
                <option>CASA (Pre-Kindergarten to Kindergarten)</option>
                </select>
        </div>

        <br><br>

    <div class="row" id="">
        <h2>Contact Information</h2>
            <div class="mb-3 mt-3">
                <label for="email">Email:</label>
                <input type="email" class="email" id="email" placeholder="Email" name="email">
            </div>

            <div class="mb-3">
                <label for="contactnumber">Contact Number:</label>
                <input type="text" class="number" id="number" placeholder="Number" name="Number">
            </div>
        </div>
    </div>

<br><br>

    <div class="row" id="">
        <h2>Other Information</h2>
            <div class="form-check">
                <h4>Mode of Learning</h4>
                <input type="checkbox" class="checkbox" id="check1" name="option1" value="checked">
                <label class="label" for="check1">Online</label>
                <input type="checkbox" class="checkbox" id="check2" name="option2" value="checked">
                <label class="label" for="check2">Face to Face</label>
                <input type="checkbox" class="checkbox" id="check3" name="option3" value="checked">
                <label class="label" for="check3">Hybrid</label>
            </div>
    </div>

    <div class="row" id="">
        <h4>I want to receive updates through the given email</h4>
        <div class="form-check form-switch">
            <input type="checkbox" class="check-input" id="check" value="yes">
            <label class="form-check-label" for="check">I agree</label>
        </div>
    </div>
</div>
</form>
